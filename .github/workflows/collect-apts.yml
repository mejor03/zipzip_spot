name: 아파트 기본정보 수집

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국시간 새벽 3시 17분
  workflow_dispatch:         # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: collect-apts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 단지 정보 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MAX_CALLS: "4500"
        run: python scripts/collect_apts.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apts.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "아파트 기본정보 수집 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
